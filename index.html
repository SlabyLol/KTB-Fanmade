<html lang="en">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Arial Black',sans-serif;user-select:none;-webkit-user-select:none;}
canvas{display:block;touch-action:none;}
#startScreen{position:fixed;inset:0;background:radial-gradient(ellipse at center,#1a0000 0%,#000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;}
#startScreen h1{font-size:clamp(2rem,9vw,5.5rem);color:#ff0000;text-shadow:0 0 30px #ff0000,0 0 60px #ff0000,0 0 100px #880000,0 5px 0 #660000;letter-spacing:4px;animation:pulse 1.4s ease-in-out infinite;margin-bottom:.3em;}
#startScreen .sub{color:#ff6600;font-size:clamp(.9rem,3vw,1.4rem);margin-bottom:.5em;letter-spacing:3px;}
#startScreen .warn{color:#555;font-size:.85rem;margin-bottom:3em;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
.modeBtn{background:linear-gradient(135deg,#990000,#cc2200);color:#fff;border:3px solid #ff4400;padding:18px 50px;font-size:1.4rem;font-weight:900;cursor:pointer;margin:10px;border-radius:10px;letter-spacing:2px;transition:all .2s;text-transform:uppercase;box-shadow:0 0 25px rgba(255,50,0,.5);}

#rageLbl{color:#ff4444;font-size:.75rem;font-weight:900;letter-spacing:2px;}
#rageBg{background:#330000;border:2px solid #550000;border-radius:10px;height:18px;overflow:hidden;}

#weaponLbl{color:#fff;font-size:.95rem;font-weight:700;pointer-events:all;cursor:pointer;}
#comboLbl{color:#ff6600;font-size:1.2rem;font-weight:900;text-shadow:0 0 12px #ff6600;min-width:90px;text-align:right;}
#shopBtn{position:fixed;bottom:20px;right:20px;background:linear-gradient(135deg,#111122,#1a1a33);color:#ffcc00;border:2px solid #ffcc00;padding:12px 20px;font-size:1rem;font-weight:900;cursor:pointer;border-radius:10px;z-index:10;box-shadow:0 0 15px rgba(255,204,0,.4);transition:all .2s;}
#shopBtn:hover{box-shadow:0 0 35px rgba(255,204,0,.8);transform:scale(1.05);}
#shopOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;overflow-y:auto;padding:20px 10px;}
#shopPanel{background:linear-gradient(135deg,#0a0a18,#180a0a);border:2px solid #cc2200;border-radius:16px;max-width:720px;margin:0 auto;padding:20px;}
#shopPanel h2{color:#ff3300;font-size:1.8rem;text-align:center;text-shadow:0 0 20px #ff3300;margin-bottom:4px;}
.shopCoins{text-align:center;color:#ffcc00;margin-bottom:14px;font-size:1.05rem;}
.wGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;}
.wItem{background:#111;border:2px solid #2a2a2a;border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;transition:all .18s;}
.wItem:hover{border-color:#ff3300;background:#1e0a0a;transform:scale(1.04);}
.wItem.owned{border-color:#00cc44;background:#001a0a;}
.wItem.sel{border-color:#ffcc00;background:#141000;box-shadow:0 0 12px rgba(255,204,0,.4);}
.wItem.broke{opacity:.45;cursor:not-allowed;}
.wEmoji{font-size:1.9rem;display:block;margin-bottom:4px;}
.wName{color:#ddd;font-size:.7rem;font-weight:700;display:block;margin-bottom:3px;}
.wCost{color:#ffcc00;font-size:.78rem;font-weight:900;}
.wOwned{color:#00cc44;font-size:.72rem;font-weight:700;}
.wSel{color:#ffcc00;font-size:.72rem;font-weight:700;}
.closeShop{display:block;width:100%;margin-top:14px;background:#aa0000;color:#fff;border:none;padding:12px;font-size:1rem;font-weight:900;border-radius:8px;cursor:pointer;}
.closeShop:hover{background:#ff0000;}
#hitBtn{display:none;position:fixed;bottom:20px;left:20px;width:78px;height:78px;background:radial-gradient(circle,#cc2200,#770000);border:3px solid #ff4400;border-radius:50%;color:#fff;font-size:1.9rem;cursor:pointer;z-index:10;box-shadow:0 0 22px rgba(255,50,0,.7);align-items:center;justify-content:center;font-weight:900;-webkit-tap-highlight-color:transparent;}
#bubble{display:none;position:fixed;background:#fff;color:#222;padding:9px 14px;border-radius:18px;font-size:.88rem;font-weight:700;max-width:190px;text-align:center;z-index:20;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.6);}
#bubble::after{content:'';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);border:9px solid transparent;border-top-color:#fff;border-bottom:0;}
#deathOverlay{display:none;position:fixed;inset:0;background:rgba(120,0,0,.65);z-index:30;align-items:center;justify-content:center;flex-direction:column;}
#deathOverlay h2{color:#ff0000;font-size:clamp(3rem,10vw,6.5rem);text-shadow:0 0 50px #ff0000,0 0 100px #ff0000;animation:dPulse .45s ease-in-out infinite;}
#deathOverlay p{color:#ff8800;font-size:1.4rem;margin-top:8px;}
@keyframes dPulse{0%,100%{transform:scale(1) rotate(-2deg);}50%{transform:scale(1.12) rotate(2deg);}}
</style>
</head>
<body>
<div id="startScreen">
  <h1>💀 KICK THE BUDDY 💀</h1>
  <p class="sub">BRUTAL FAN EDITION</p>
  <p class="warn">Totally not violent · FAN MADE · NOT OFFICIAL</p>
  <div>
    <button class="modeBtn" id="btnPc">🖥️ PC MODE</button>
    <p class="modeCaption">Click to hit · Click & drag to THROW</p>
  </div>
  <div style="margin-top:12px">
    <button class="modeBtn" id="btnMobile">📱 MOBILE MODE</button>
    <p class="modeCaption">Tap to hit · Drag to THROW · Big button below</p>
  </div>
</div>
<div id="hud" style="display:none">
  <div id="coins">🪙 0</div>
  <div id="rageWrap">
    <div id="rageLbl">FAT-BAR: 0%</div>
    <div id="rageBg"><div id="rageFill"></div></div>
  </div>
  <div id="comboLbl"></div>
  <div id="weaponLbl"></div>
</div>
<canvas id="c"></canvas>
<button id="shopBtn" style="display:none" onclick="openShop()">🛒 SHOP</button>
<div id="hitBtn" onclick="mobileHit()">💥</div>
<div id="bubble"></div>
<div id="deathOverlay">
  <h2>💀 HE'S DEAD! 💀</h2>
  <p>Respawning in 4 seconds...</p>
</div>
<div id="shopOverlay">
  <div id="shopPanel">
    <h2>⚔️ WEAPON SHOP ⚔️</h2>
    <div class="shopCoins" id="shopCoins"></div>
    <div class="wGrid" id="wGrid"></div>
    <button class="closeShop" onclick="closeShop()">❌ CLOSE SHOP</button>
  </div>
</div>
<script>
/* Full game follows - buttons fixed with addEventListener */
const WEAPONS=[{id:'fist',name:'Fist',emoji:'👊',cost:0,dmg:8,type:'hit',rapid:false},{id:'boot',name:'Steel Boot',emoji:'👢',cost:100,dmg:15,type:'hit',rapid:false},{id:'bat',name:'Baseball Bat',emoji:'🏏',cost:180,dmg:24,type:'hit',rapid:false},{id:'crowbar',name:'Crowbar',emoji:'🔧',cost:220,dmg:30,type:'hit',rapid:false},{id:'sword',name:'Katana',emoji:'⚔️',cost:300,dmg:38,type:'slash',rapid:false},{id:'axe',name:'Battle Axe',emoji:'🪓',cost:350,dmg:45,type:'slash',rapid:false},{id:'knife',name:'Knife',emoji:'🔪',cost:250,dmg:28,type:'slash',rapid:true},{id:'chainsaw',name:'Chainsaw',emoji:'⚙️',cost:800,dmg:55,type:'slash',rapid:true},{id:'scythe',name:'Scythe',emoji:'☠️',cost:900,dmg:65,type:'slash',rapid:false},{id:'gun',name:'Pistol',emoji:'🔫',cost:400,dmg:45,type:'bullet',rapid:false},{id:'shotgun',name:'Shotgun',emoji:'🦆',cost:500,dmg:80,type:'shotgun',rapid:false},{id:'ak47',name:'AK-47',emoji:'🔰',cost:650,dmg:32,type:'bullet',rapid:true},{id:'sniper',name:'Sniper',emoji:'🎯',cost:700,dmg:130,type:'bullet',rapid:false},{id:'acid',name:'Acid Bucket',emoji:'🧪',cost:600,dmg:60,type:'acid',rapid:false},{id:'zombie',name:'Zombie Hand',emoji:'🧟',cost:450,dmg:35,type:'zombie',rapid:false},{id:'spider',name:'Spider Venom',emoji:'🕷️',cost:550,dmg:50,type:'acid',rapid:false},{id:'hammer',name:'Thor Hammer',emoji:'🔨',cost:850,dmg:95,type:'hammer',rapid:false},{id:'tnt',name:'TNT',emoji:'🧱',cost:700,dmg:90,type:'explode',rapid:false},{id:'grenade',name:'Grenade',emoji:'💣',cost:750,dmg:100,type:'explode',rapid:false},{id:'flame',name:'Flamethrower',emoji:'🔥',cost:1000,dmg:75,type:'fire',rapid:true},{id:'drugs',name:'Drugs',emoji:'💉',cost:1000,dmg:200,type:'acid',rapid:false},{id:'freeze',name:'Freeze Ray',emoji:'🧊',cost:900,dmg:45,type:'freeze',rapid:false},{id:'laser',name:'Death Laser',emoji:'💡',cost:1200,dmg:150,type:'laser',rapid:false},{id:'rocket',name:'Rocket',emoji:'🚀',cost:1400,dmg:200,type:'explode',rapid:false},{id:'blackhole',name:'Black Hole',emoji:'🌑',cost:2000,dmg:180,type:'black',rapid:false},{id:'nuke',name:'☢️ ATOM BOMB',emoji:'☢️',cost:5000,dmg:500,type:'nuke',rapid:false},{id:'minigun',name:'Minigun OP',emoji:'🔫',cost:5000,dmg:120,type:'bullet',rapid:true},{id:'heal',name:'Chicken Rocket',emoji:'🐔',cost:3000,dmg:-100,type:'heal',rapid:false},{id:'dildo',name:'Amrs Toy',emoji:'🍆',cost:2500,dmg:1000,type:'laser',rapid:true}];
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!isDead){handleHit(selWeapon.dmg,B.x,B.y);shake.i=5;playSound(selWeapon.type);}}});
const canvas=document.getElementById('c');const ctx=canvas.getContext('2d');
let gameMode='pc',coins=0,rage=0,combo=0,comboTimer=0,selWeapon=WEAPONS[0],owned=new Set(['fist']),isDead=false,isDrag=false,dragOX=0,dragOY=0,mX=0,mY=0,audioCtx=null,isSpeaking=false,lastTaunt=0,bloodSplats=[],particles=[],shake={x:0,y:0,i:0},room={L:0,R:0,T:0,B:0},baseX=0,baseY=0,dragHist=[],rapidTimer=0,freezeTimer=0;
const B={x:0,y:0,vx:0,vy:0,rot:0,aVel:0,scale:1,scaleTarget:1,LA:-0.3,RA:0.3,LL:0.1,RL:-0.1,expr:'normal',exprT:0,hitFlash:0,bruised:false,torn:false,bleedT:0,isFrozen:false};
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;room.L=70;room.R=canvas.width-70;room.T=75;room.B=canvas.height-55;baseX=canvas.width/2;baseY=room.T+(room.B-room.T)*0.42;if(!isDrag&&Math.abs(B.vx)<1&&Math.abs(B.vy)<1){B.x=baseX;B.y=baseY;}}
function getAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function noise(ac,dur,filt,filtFreq,vol){const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);const src=ac.createBufferSource();const f=ac.createBiquadFilter();f.type=filt;f.frequency.value=filtFreq;const g=ac.createGain();const now=ac.currentTime;src.buffer=buf;src.connect(f);f.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(0.001,now+dur);src.start(now);src.stop(now+dur);}
function osc(ac,type,freqA,freqB,dur,vol){const o=ac.createOscillator();const g=ac.createGain();const now=ac.currentTime;o.type=type;o.frequency.setValueAtTime(freqA,now);if(freqB)o.frequency.exponentialRampToValueAtTime(freqB,now+dur);o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(0.001,now+dur);o.start(now);o.stop(now+dur);}
function playSound(type){try{const ac=getAC();if(type==='punch'||type==='hit'){osc(ac,'sawtooth',200,25,.18,.7);}else if(type==='slash'){noise(ac,.12,'highpass',2500,.5);}else if(type==='gun'||type==='bullet'){noise(ac,.09,'bandpass',2000,1);}else if(type==='shotgun'){noise(ac,.15,'lowpass',1200,1.2);osc(ac,'sawtooth',80,20,.2,.4);}else if(type==='chainsaw'){osc(ac,'sawtooth',82,78,.4,.3);osc(ac,'sawtooth',85,79,.4,.25);}else if(type==='explode'){noise(ac,.7,'lowpass',600,1.5);osc(ac,'sine',60,10,.5,.8);}else if(type==='acid'||type==='heal'){osc(ac,'sine',900,150,.3,.25);}else if(type==='fire'){noise(ac,.3,'bandpass',500,.4);}else if(type==='laser'){osc(ac,'sine',3500,100,.2,.35);}else if(type==='freeze'){osc(ac,'triangle',2000,4000,.2,.3);noise(ac,.15,'highpass',4000,.2);}else if(type==='zombie'){osc(ac,'square',130,60,.35,.25);}else if(type==='black'){osc(ac,'sine',60,8,.6,.5);}else if(type==='hammer'){noise(ac,.1,'lowpass',800,1);osc(ac,'sawtooth',120,20,.15,.6);}else if(type==='nuke'){noise(ac,1.5,'lowpass',400,2);osc(ac,'sine',40,5,1.5,1);setTimeout(()=>{noise(ac,.8,'lowpass',1000,1.5);},300);}}catch(e){}}
function handleHit(dmg,x,y){if(isDead)return;if(selWeapon.id==='heal'){rage=Math.min(100,rage+12);coins+=80;B.scaleTarget=Math.min(2.2,(B.scaleTarget||1)+0.12);B.expr='normal';B.exprT=0.6;mkHeal(B.x,B.y);if(!isSpeaking)speak(rndLine('heal'));if(rage>=100)killBuddy();}else{const actualDmg=Math.abs(dmg);rage=Math.min(100,rage+actualDmg*0.28);coins+=actualDmg*12;combo+=1;comboTimer=1.8;B.expr='pain';B.exprT=0.9;B.hitFlash=1;mkBlood(B.x,B.y,6+Math.floor(actualDmg/20),6+actualDmg/15);if(Math.random()>0.75&&!isSpeaking)speak(rndLine(selWeapon.type==='slash'?'slash':'hit'));}if(rage>=100&&!isDead)killBuddy();updateHUD();}
function triggerDeath(){killBuddy();}
const LINES={hit:["OUCH!","AHH!","STOP IT!","THAT HURTS!","PLEASE NO!","OW OW OW!","MY FACE!","HELP ME!","NOT AGAIN!","WHY?!"],slash:["MY ARM!","I'M BLEEDING!","STOOOOP!","MURDERER!","CUT ME NOT!","AHHHHH!"],explode:["KABOOM!","I'M ON FIRE!","TOO MUCH!","MY ORGANS!","BLOWN APART!","WHAT WAS THAT?!"],acid:["IT BURNS!","DISSOLVING!","ACID HURTS!","MELTING!","SIZZLING PAIN!"],zombie:["BRAAAAINS!","WHAT IS THAT?!","ZOMBIE ATTACK!","GET IT OFF ME!"],freeze:["SO COLD!","I CAN'T MOVE!","FROZEN!","BRRRR!"],black:["INTO THE VOID!","SINGULARITY!","HELP!","NOOOOO!"],taunt:["Is that all?","Come on hit me!","I've felt worse...","HARDER!","Pathetic!","My grandma hits harder!","You call that a punch?","More! MORE!"],rage50:["Oh no...","Not good!","Stop before it's too late!","I can feel the rage..."],rage90:["CRITICAL RAGE!","I'M GONNA BLOW!","EVACUATE NOW!","DANGER DANGER!"],death:["GOODBYE CRUEL WORLD!","I'M DEAD!","TELL MY FAMILY!","NOOOOOOO!","SO THIS IS THE END!"],heal:["Oh.. thx!"]};
function rndLine(cat){const a=LINES[cat]||LINES.hit;return a[Math.floor(Math.random()*a.length)];}
function speak(txt){if(!window.speechSynthesis||isSpeaking)return;try{const u=new SpeechSynthesisUtterance(txt);u.rate=1.2+Math.random()*.6;u.pitch=0.7+Math.random()*.9;u.volume=1;u.onend=u.onerror=()=>{isSpeaking=false;};isSpeaking=true;speechSynthesis.cancel();speechSynthesis.speak(u);showBubble(txt);}catch(e){isSpeaking=false;}}
function showBubble(txt){const el=document.getElementById('bubble');el.textContent=txt;el.style.left=Math.max(10,Math.min(canvas.width-200,B.x-90))+'px';el.style.top=Math.max(10,B.y-130)+'px';el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2200);}
function mkBlood(x,y,n,spd,xVel=0,yVel=0){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2;const s=spd*(0.3+Math.random()*.7);particles.push({t:'blood',x,y,vx:Math.cos(a)*s+xVel*.3,vy:Math.sin(a)*s+yVel*.3-Math.random()*2,sz:2+Math.random()*9,life:1,dec:0.013+Math.random()*.018,col:Math.random()<.65?'#bb0000':Math.random()<.5?'#880000':'#ff2200',grav:.32});}}
function mkExplosion(x,y,R){for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,s=R*.055*(0.5+Math.random());particles.push({t:'fire',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,sz:12+Math.random()*22,life:1,dec:.022+Math.random()*.018,col:Math.random()<.4?'#ffff88':Math.random()<.5?'#ff8800':'#ff3300',grav:-.06});}particles.push({t:'shock',x,y,sz:10,maxSz:R*1.4,life:1,dec:.04,col:'rgba(255,200,100',grav:0,vx:0,vy:0});for(let i=0;i<25;i++){const a=Math.random()*Math.PI*2,s=R*.09*(0.5+Math.random());particles.push({t:'debris',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,sz:3+Math.random()*9,life:1,dec:.009,col:'#665544',grav:.45,rot:Math.random()*Math.PI*2,aVel:(Math.random()-.5)*.35});}for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2;particles.push({t:'smoke',x:x+(Math.random()-.5)*R*.5,y:y+(Math.random()-.5)*R*.5,vx:Math.cos(a)*1.5,vy:Math.sin(a)-.8,sz:22+Math.random()*30,life:1,dec:.006,col:'#444',grav:-.04});}mkBlood(x,y,45,R*.07);}
function mkAcid(x,y){for(let i=0;i<35;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*7;particles.push({t:'acid',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,sz:4+Math.random()*12,life:1,dec:.018,col:Math.random()<.5?'#00ff44':'#aaff00',grav:.25});}}
function mkHeal(x,y){for(let i=0;i<35;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*7;particles.push({t:'heal',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,sz:4+Math.random()*12,life:1,dec:.018,col:Math.random()<.5?'#00ff44':'#aaff00',grav:.25});}}
function mkLaser(x,y){for(let i=0;i<25;i++){particles.push({t:'laser',x:x+(Math.random()-.5)*50,y:y+(Math.random()-.5)*50,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10,sz:2+Math.random()*7,life:1,dec:.04,col:Math.random()<.5?'#ff00ff':'#ff99ff',grav:0});}}
function mkFreeze(x,y){for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2;particles.push({t:'ice',x,y,vx:Math.cos(a)*(2+Math.random()*5),vy:Math.sin(a)*(2+Math.random()*5),sz:3+Math.random()*8,life:1,dec:.02,col:Math.random()<.5?'#88ddff':'#ffffff',grav:.1});}}
function mkBodyParts(x,y){const emojis=['💀','🦴','🫀','🧠','🫁','🦷','👁️','🩸'];for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2,s=5+Math.random()*14;particles.push({t:'part',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-9,sz:18+Math.random()*18,life:1,dec:.005,col:'#fff',grav:.55,emoji:emojis[Math.floor(Math.random()*emojis.length)],rot:Math.random()*Math.PI*2,aVel:(Math.random()-.5)*.4});}}

function mkSlashArc(x,y){
  for(let i=0;i<8;i++){
    const a=-1.2+Math.random()*2.4;
    particles.push({t:'slash',x:x,y:y,vx:Math.cos(a)*8,vy:Math.sin(a)*4-2,
      sz:20+Math.random()*30,life:1,dec:.06,col:'#ffffff',grav:0,rot:a,aVel:0});
  }
  mkBlood(x,y,18,11);
}
function mkSparks(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=4+Math.random()*10;
    particles.push({t:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,
      sz:2+Math.random()*4,life:1,dec:.04,col:Math.random()<.5?'#ffff88':'#ffaa00',grav:.2});
  }
}
function mkImpact(x,y){
  particles.push({t:'impact',x,y,sz:5,maxSz:80,life:1,dec:.08,col:'rgba(255,255,255',grav:0,vx:0,vy:0});

// ===== REAL DRAWN WEAPONS (no emojis) =====
function spawnWeaponVisual(type, fromX, fromY, toX, toY){
  const dx=toX-fromX, dy=toY-fromY;
  const dist=Math.sqrt(dx*dx+dy*dy)||1;
  flyingItems.push({
    type: type,
    x: fromX, y: fromY,
    tx: toX, ty: toY,
    vx: (dx/dist)*18, vy: (dy/dist)*18 - 2,
    life: 1, rot: Math.atan2(dy,dx),
    scale: 1, phase: 0
  });
}

function updateFlyingItems(){
  for(let i=flyingItems.length-1;i>=0;i--){
    const w=flyingItems[i];
    w.x += w.vx; w.y += w.vy;
    w.vy += 0.35;
    w.rot += 0.15;
    w.life -= 0.035;
    w.phase += 0.2;
    if(w.life<=0) flyingItems.splice(i,1);
  }
}

function drawFlyingItems(){
  flyingItems.forEach(w=>{
    ctx.save();
    ctx.globalAlpha = Math.max(0, w.life);
    ctx.translate(w.x, w.y);
    ctx.rotate(w.rot);
    ctx.scale(w.scale, w.scale);
    drawWeaponShape(w.type, w.phase);
    ctx.restore();
  });
}

    ctx.fillRect(-6,-18,12,12);
    ctx.strokeStyle='#ff0'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,-18); ctx.quadraticCurveTo(8,-28,4,-35); ctx.stroke();
    // spark
    ctx.fillStyle='#ff0';
    ctx.beginPath(); ctx.arc(4,-35,3,0,Math.PI*2); ctx.fill();
    if(type==='nuke'){ ctx.fillStyle='#0f0'; ctx.font='12px Arial'; ctx.textAlign='center'; ctx.fillText('☢',0,10); }
  } else if(type==='heal' || type==='chicken'){
    // Chicken body
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(0,0,16,14,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff0';
    ctx.beginPath(); ctx.ellipse(14,-4,8,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#f80';
    ctx.beginPath(); ctx.moveTo(20,-4); ctx.lineTo(28,-2); ctx.lineTo(20,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#f00';
    ctx.beginPath(); ctx.ellipse(12,-10,4,5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(16,-5,2,0,Math.PI*2); ctx.fill();
    // wing
    ctx.fillStyle='#eee';
    ctx.beginPath(); ctx.ellipse(-4,2,10,6,-0.3,0,Math.PI*2); ctx.fill();
  } else if(type==='acid' || type==='spider'){
    ctx.fillStyle='#0f0';
    ctx.beginPath(); ctx.arc(0,0,14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0a0';
    for(let i=0;i<6;i++){ const a=i/6*Math.PI*2+phase; ctx.beginPath(); ctx.arc(Math.cos(a)*10,Math.sin(a)*10,4,0,Math.PI*2); ctx.fill(); }
  } else if(type==='fire' || type==='flame'){
    const g=ctx.createRadialGradient(0,0,2,0,0,20);
    g.addColorStop(0,'#ff0'); g.addColorStop(0.5,'#f80'); g.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,20,0,Math.PI*2); ctx.fill();
  } else if(type==='freeze'){
    ctx.strokeStyle='#8cf'; ctx.lineWidth=3;
    for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*18,Math.sin(a)*18); ctx.stroke(); }
    ctx.fillStyle='rgba(150,220,255,0.5)'; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
  } else if(type==='laser'){
    ctx.strokeStyle='#f0f'; ctx.lineWidth=4; ctx.shadowBlur=15; ctx.shadowColor='#f0f';
    ctx.beginPath(); ctx.moveTo(-30,0); ctx.lineTo(30,0); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
  } else if(type==='hammer'){
    ctx.fillStyle='#888';
    ctx.fillRect(-20,-30,40,18);
    ctx.fillStyle='#8B4513';
    ctx.fillRect(-5,-12,10,40);
  } else if(type==='zombie'){
    ctx.fillStyle='#5a5';
    ctx.beginPath(); ctx.ellipse(0,0,12,20,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#3a3';
    ctx.fillRect(-8,10,7,18); ctx.fillRect(1,10,7,18);
  } else if(type==='black' || type==='blackhole'){
    ctx.fillStyle='#000';
    ctx.beginPath(); ctx.arc(0,0,16,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#808'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(0,0,20+Math.sin(phase)*4,0,Math.PI*2); ctx.stroke();
  } else {
    // default fist
    ctx.fillStyle='#e8b878';
    ctx.beginPath(); ctx.ellipse(0,0,16,12,0,0,Math.PI*2); ctx.fill();
  }
}

function inBuddy(px,py){const dx=px-B.x,dy=py-B.y;return Math.sqrt(dx*dx+dy*dy)<85;}
function hitBuddy(px,py,weapon){if(isDead)return;const dx=B.x-px,dy=B.y-py;const d=Math.sqrt(dx*dx+dy*dy)||1;const dmg=weapon.dmg*(1+combo*.08);rage=Math.min(100,rage+dmg*.28);coins+=Math.floor(dmg*.5*(1+combo*.04));combo++;comboTimer=3.5;const force=7+dmg*.18;if(!B.isFrozen){B.vx=(dx/d)*force*.85+(Math.random()-.5)*3;B.vy=(dy/d)*force*.85-3.5;B.aVel=(Math.random()-.5)*.45;}spawnWeaponVisual(weapon.type==='hit'?weapon.id:weapon.type, mX||B.x-80, mY||B.y-40, B.x, B.y); B.hitFlash=1;B.expr='pain';B.exprT=1.5;B.bruised=rage>38;B.torn=rage>58;shake.i=Math.max(shake.i,Math.min(22,dmg*.1));switch(weapon.type){
case 'hit':
  mkImpact(B.x,B.y);mkBlood(B.x,B.y,14,8);playSound('punch');speak(rndLine('hit'));
  shake.i=Math.max(shake.i,8);break;
case 'slash':
  mkSlashArc(B.x,B.y);mkBlood(B.x,B.y,26,12);playSound('slash');speak(rndLine('slash'));
  shake.i=Math.max(shake.i,10);break;
case 'shotgun':
  mkImpact(B.x,B.y);mkBlood(B.x,B.y,40,16);mkSparks(B.x,B.y,20);playSound('shotgun');speak(rndLine('slash'));
  shake.i=Math.max(shake.i,18);break;
case 'bullet':
  mkImpact(B.x,B.y);mkBlood(B.x,B.y,20,14);mkSparks(B.x,B.y,15);playSound('gun');speak(rndLine('hit'));
  shake.i=Math.max(shake.i,12);break;
case 'explode':
  {const R=weapon.id==='nuke'?320:weapon.id==='rocket'?210:130;
  mkExplosion(B.x,B.y,R);playSound(weapon.id==='nuke'?'nuke':'explode');
  shake.i=Math.max(shake.i,weapon.id==='nuke'?45:28);speak(rndLine('explode'));
  if(weapon.id==='nuke'){for(let i=0;i<12;i++)splatWall(Math.random()*canvas.width,Math.random()*canvas.height,10);}}
  break;
case 'acid':
  mkAcid(B.x,B.y);mkAcid(B.x+(Math.random()-.5)*40,B.y+(Math.random()-.5)*40);playSound('acid');speak(rndLine('acid'));
  shake.i=Math.max(shake.i,10);break;
case 'zombie':
  mkBlood(B.x,B.y,22,10);mkSparks(B.x,B.y,8);playSound('zombie');speak(rndLine('zombie'));
  shake.i=Math.max(shake.i,9);break;
case 'fire':
  for(let i=0;i<5;i++) mkExplosion(B.x+(Math.random()-.5)*60,B.y+(Math.random()-.5)*60,70);
  playSound('fire');speak(rndLine('explode'));shake.i=Math.max(shake.i,16);break;
case 'freeze':
  mkFreeze(B.x,B.y);mkFreeze(B.x,B.y);playSound('freeze');speak(rndLine('freeze'));
  B.isFrozen=true;freezeTimer=3.5;B.expr='pain';B.exprT=3.5;shake.i=Math.max(shake.i,8);break;
case 'laser':
  mkLaser(B.x,B.y);mkLaser(B.x,B.y);mkSparks(B.x,B.y,25);playSound('laser');speak(rndLine('hit'));
  shake.i=Math.max(shake.i,14);break;
case 'hammer':
  mkExplosion(B.x,B.y,110);mkImpact(B.x,B.y);mkSparks(B.x,B.y,20);playSound('hammer');speak(rndLine('explode'));
  B.vy=-20;shake.i=Math.max(shake.i,22);break;
case 'black':
  playSound('black');B.scaleTarget=0.12;
  setTimeout(()=>{B.scaleTarget=2.0;setTimeout(()=>{B.scaleTarget=1;mkExplosion(B.x,B.y,240);mkBlood(B.x,B.y,70,14);},450);},650);
  speak(rndLine('black'));shake.i=Math.max(shake.i,20);break;
case 'nuke':
  mkExplosion(B.x,B.y,380);playSound('nuke');
  for(let i=0;i<20;i++)splatWall(Math.random()*canvas.width,Math.random()*canvas.height,14);
  speak(rndLine('explode'));shake.i=Math.max(shake.i,50);break;
case 'heal':
  rage=Math.min(100,rage+12);B.scaleTarget=Math.min(2.2,(B.scaleTarget||1)+0.12);
  mkHeal(B.x,B.y);mkHeal(B.x,B.y);playSound('heal');speak(rndLine('heal'));
  if(rage>=100)killBuddy();break;
}if(weapon.id==='chainsaw'){playSound('chainsaw');mkBlood(B.x,B.y,30,14);mkSlashArc(B.x,B.y);shake.i=Math.max(shake.i,14);}if(rage>=50&&rage<54)speak(rndLine('rage50'));if(rage>=90&&rage<94){speak(rndLine('rage90'));B.expr='rage';B.exprT=4;}if(rage>=100&&!isDead)killBuddy();updateHUD();}
function killBuddy(){isDead=true;B.expr='dead';speak(rndLine('death'));playSound('nuke');shake.i=50;mkExplosion(B.x,B.y,320);mkBodyParts(B.x,B.y);for(let i=0;i<120;i++)mkBlood(B.x+(Math.random()-.5)*250,B.y+(Math.random()-.5)*250,5,18);for(let i=0;i<20;i++)splatWall(Math.random()*canvas.width,Math.random()*canvas.height,14);for(let i=0;i<8;i++){setTimeout(()=>{mkExplosion(B.x+(Math.random()-.5)*180,B.y+(Math.random()-.5)*180,160);playSound('explode');shake.i=Math.max(shake.i,30);splatWall(B.x+(Math.random()-.5)*200,B.y+(Math.random()-.5)*200,8);},i*350);}const overlay=document.getElementById('deathOverlay');overlay.style.display='flex';setTimeout(()=>{isDead=false;rage=0;combo=0;comboTimer=0;B.expr='normal';B.exprT=0;B.hitFlash=0;B.bruised=false;B.torn=false;B.isFrozen=false;B.x=baseX;B.y=baseY;B.vx=0;B.vy=0;B.rot=0;B.aVel=0;B.scale=1;B.scaleTarget=1;particles.length=0;overlay.style.display='none';speak("I'm back... You'll regret that!");updateHUD();},4500);}
function updateHUD(){document.getElementById('coins').textContent='🪙 '+Math.floor(coins);const fill=document.getElementById('rageFill');const lbl=document.getElementById('rageLbl');const pct=Math.min(100,Math.max(0,rage));fill.style.width=pct+'%';if(pct<40){fill.style.background='linear-gradient(to right,#ffaa00,#ff6600)';fill.style.boxShadow='0 0 8px #ffaa00';}else if(pct<75){fill.style.background='linear-gradient(to right,#ff6600,#ff2200)';fill.style.boxShadow='0 0 10px #ff4400';}else{fill.style.background='linear-gradient(to right,#ff2200,#ff0000)';fill.style.boxShadow='0 0 14px #ff0000';}lbl.textContent='FAT-BAR: '+Math.floor(pct)+'%';lbl.style.color=pct>=90?'#ff0000':(pct>=50?'#ff6600':'#ffaa44');document.getElementById('weaponLbl').textContent='WEAPON: '+selWeapon.emoji+' '+selWeapon.name;if(combo>1){document.getElementById('comboLbl').textContent='COMBO X'+combo;}else{document.getElementById('comboLbl').textContent='';}}
function openShop(){document.getElementById('shopOverlay').style.display='block';document.getElementById('shopCoins').textContent='🪙 '+coins+' coins';const grid=document.getElementById('wGrid');grid.innerHTML='';WEAPONS.forEach(w=>{const o=owned.has(w.id),sel=selWeapon.id===w.id,ca=coins>=w.cost;const div=document.createElement('div');div.className='wItem'+(o?(sel?' sel':' owned'):(ca?'':' broke'));div.innerHTML='<span class="wEmoji">'+w.emoji+'</span><span class="wName">'+w.name+'</span><span>'+(o?(sel?'<span class="wSel">✓ ACTIVE</span>':'<span class="wOwned">✓ OWNED</span>'):'<span class="wCost">🪙 '+w.cost+'</span>')+'</span>';div.onclick=()=>{if(o){selWeapon=w;closeShop();}else if(ca){coins-=w.cost;owned.add(w.id);selWeapon=w;closeShop();}};grid.appendChild(div);});}
function closeShop(){document.getElementById('shopOverlay').style.display='none';updateHUD();}
let pDown=false,pStartX=0,pStartY=0;
function onDown(px,py){try{getAC().resume();}catch(e){}pDown=true;pStartX=px;pStartY=py;mX=px;mY=py;dragHist=[{x:px,y:py,t:Date.now()}];if(inBuddy(px,py)){isDrag=true;dragOX=px-B.x;dragOY=py-B.y;}}
function onMove(px,py){mX=px;mY=py;dragHist.push({x:px,y:py,t:Date.now()});if(dragHist.length>12)dragHist.shift();canvas.style.cursor=inBuddy(px,py)||isDrag?'grabbing':'crosshair';}
function onUp(px,py){if(!pDown)return;pDown=false;if(isDrag){isDrag=false;if(dragHist.length>=2){const rec=dragHist.slice(-5);const dt2=Math.max(1,(rec[rec.length-1].t-rec[0].t));B.vx=(rec[rec.length-1].x-rec[0].x)/dt2*16;B.vy=(rec[rec.length-1].y-rec[0].y)/dt2*16;B.aVel=B.vx*.06;}}else{const dx=px-pStartX,dy=py-pStartY;if(Math.sqrt(dx*dx+dy*dy)<18&&inBuddy(px,py))hitBuddy(px,py,selWeapon);}dragHist=[];}
canvas.addEventListener('mousedown',e=>onDown(e.clientX,e.clientY));window.addEventListener('mousemove',e=>onMove(e.clientX,e.clientY));window.addEventListener('mouseup',e=>onUp(e.clientX,e.clientY));canvas.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];onDown(t.clientX,t.clientY);},{passive:false});canvas.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];onMove(t.clientX,t.clientY);},{passive:false});canvas.addEventListener('touchend',e=>{e.preventDefault();const t=e.changedTouches[0];onUp(t.clientX,t.clientY);},{passive:false});canvas.addEventListener('mousedown',e=>{if(selWeapon.rapid){rapidTimer=setInterval(()=>{if(inBuddy(mX,mY))hitBuddy(mX,mY,selWeapon);},120);}});window.addEventListener('mouseup',()=>{clearInterval(rapidTimer);rapidTimer=0;});
function mobileHit(){try{getAC().resume();}catch(e){}hitBuddy(B.x+(Math.random()-.5)*50,B.y+(Math.random()-.5)*50,selWeapon);}
let lastTs=0;
function loop(ts){const dt=Math.min((ts-lastTs)/1000,.05);lastTs=ts;if(shake.i>0.5){shake.x=(Math.random()-.5)*shake.i;shake.y=(Math.random()-.5)*shake.i;shake.i*=.82;}else{shake.x=0;shake.y=0;shake.i=0;}ctx.save();ctx.translate(shake.x,shake.y);ctx.clearRect(-50,-50,canvas.width+100,canvas.height+100);drawRoom();updateParticles();drawParticles();updateFlyingItems();drawFlyingItems();updateBuddy(dt);drawBuddy();if(rage>60){const a=(rage-60)/40*.35;const rv=ctx.createRadialGradient(canvas.width/2,canvas.height/2,100,canvas.width/2,canvas.height/2,Math.max(canvas.width,canvas.height)*.75);rv.addColorStop(0,'rgba(0,0,0,0)');rv.addColorStop(1,'rgba(180,0,0,'+a+')');ctx.fillStyle=rv;ctx.fillRect(-50,-50,canvas.width+100,canvas.height+100);}ctx.restore();requestAnimationFrame(loop);}
function startGame(mode){try{gameMode=mode||'pc';document.getElementById('startScreen').style.display='none';document.getElementById('hud').style.display='flex';document.getElementById('shopBtn').style.display='block';if(mode==='mobile'){document.getElementById('hitBtn').style.display='flex';}resize();B.x=baseX;B.y=baseY;updateHUD();lastTs=performance.now();requestAnimationFrame(loop);}catch(err){console.error('startGame error:',err);alert('Start error: '+err.message);}}
window.startGame=startGame;window.addEventListener('resize',resize);
document.getElementById('btnPc').addEventListener('click',function(){startGame('pc');});
document.getElementById('btnMobile').addEventListener('click',function(){startGame('mobile');});
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
</script>
